# EthGuard sample configuration.
# Copy and adapt this file for your application.
#
# Unknown keys are rejected at load time: a misspelled knob fails fast
# instead of silently falling back to defaults.

chain_id: 1

upstreams:
  - id: primary
    endpoint: https://eth.example.com
  - id: secondary
    endpoint: https://eth-backup.example.com

# To use raw WebSocket on a source, set both explicitly:
#   transport: wss
#   endpoint: wss://your-provider.example
# Omitted transport stays native HTTP. WSS participates in writes too;
# two endpoints of the same backend do not imply independent trust.

# Optional knobs with their defaults:
# collect_timeout: 30s      # per-aggregate collection bound, positive duration
# anchoring:
#   preset: strict          # strict | finalized
#   max_lag: 32             # finalized preset freshness bound, blocks; 0 selects default
# tip_tracking:
#   interval: 10s           # freshness sampling period; empty selects default
#   max_behind: 32          # blocks behind the fleet reference before a source is skipped
