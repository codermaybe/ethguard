# golangci-lint v2 configuration.
#
# Policy notes (keep in sync with the CI lint gate):
# - staticcheck ST1000/ST1003/ST1016/ST1020/ST1021/ST1023 and QF* are off:
#   the ST subset is the classic default-off doc/naming style group, and
#   ST1003 would churn public API names (e.g. the ethclient-compat ChainId
#   capitalization). QF* rewrites audit-sensitive conditions (e.g. De Morgan)
#   without fixing anything.
# - errcheck and errorlint include tests and tooling. Deliberate identity or
#   ownership assertions use line-level exceptions with a specific reason.
#   Cleanup that owns no pending output may explicitly discard its error;
#   report writes and fixture encoding must handle failures.
# - errorlint: the production idiom
#   `fmt.Errorf("%w: ... %v", ClassSentinel, cause)`
#   wraps the decision-class sentinel with %w and carries the cause as detail,
#   so errors.Is against the class already works — the "non-wrapping format
#   verb" finding on that pattern is deliberate, not a bug.
# - copyloopvar: Go 1.22+ loop-variable semantics make `i := i` hoists dead.
# - nilerr and contextcheck were evaluated and deliberately NOT enabled:
#   nilerr flags the intentional fallback/degrade returns (e.g. rawbody falls
#   back to the ordinary dialer; conformance records an Issue and returns),
#   contextcheck false-positives on pool.Source.dial which does inherit ctx.
# - G115, forcetypeassert and structural/style rules remain review reports:
#   checked numeric domains, frozen types and immutable snapshots need owner
#   reasoning, not broad exclusions or mechanical pointer/helper rewrites.
version: "2"

run:
  timeout: 8m
  tests: true
  relative-path-mode: wd

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - makezero
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - wastedassign
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1023
        - -QF*
    errorlint:
      errorf: false
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    generated: disable
    presets: []
    paths: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
