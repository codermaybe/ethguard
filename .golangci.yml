# golangci-lint v2 configuration.
#
# Policy notes (keep in sync with the CI lint gate):
# - staticcheck ST1000/ST1003/ST1016/ST1020/ST1021/ST1023 and QF* are off:
#   the ST subset is the classic default-off doc/naming style group, and
#   ST1003 would churn public API names (e.g. the ethclient-compat ChainId
#   capitalization). QF* rewrites audit-sensitive conditions (e.g. De Morgan)
#   without fixing anything.
# - errcheck is excluded on _test.go (fixtures fail loudly on wrong behavior)
#   and on tooling paths (cmd/, rpctest/, internal sampling/conformance tools)
#   whose I/O is best-effort by design.
# - errorlint: enabled with two documented exclusions. (1) tests compare
#   sentinel identity on purpose (membership checks between known classes);
#   (2) the production idiom `fmt.Errorf("%w: ... %v", ClassSentinel, cause)`
#   wraps the decision-class sentinel with %w and carries the cause as detail,
#   so errors.Is against the class already works — the "non-wrapping format
#   verb" finding on that pattern is deliberate, not a bug.
# - copyloopvar: Go 1.22+ loop-variable semantics make `i := i` hoists dead.
# - nilerr and contextcheck were evaluated and deliberately NOT enabled:
#   nilerr flags the intentional fallback/degrade returns (e.g. rawbody falls
#   back to the ordinary dialer; conformance records an Issue and returns),
#   contextcheck false-positives on pool.Source.dial which does inherit ctx.
version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1023
        - -QF*
    errorlint:
      errorf: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errorlint
      - path: (cmd|rpctest|internal)/
        linters:
          - errcheck
