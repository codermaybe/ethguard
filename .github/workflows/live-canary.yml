# EthGuard live canary
#
# This workflow is an observation pipeline, not an offline code gate:
#   - PR/push CI stays in ci.yml and never contacts a live provider.
#   - schedule/tag runs acquire Chainlist once, execute the fixed plan, and
#     publish the manifest, registry copy, report, and digests.
#   - Scheduled non-passed observations and inconclusive prerelease-tag
#     observations count as successful report delivery, not audit approval.
#   - Stable tags and manual runs retain the strict gate. Failed prerelease
#     observations also remain failures.
#   - Tool/artifact failures still fail. GitHub hosting is not an independent audit.

name: live-canary

on:
  schedule:
    # Daily observation. The exact time is not a freshness promise.
    - cron: '17 3 * * *'
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      commit_sha:
        description: 'Exact commit validated by the release workflow'
        required: true
        type: string
      release_tag:
        description: 'Published tag, used only for prerelease observation policy'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-canary:
    name: live canary (observation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: assert exact commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: build livecanary
        run: go build -trimpath -o "${RUNNER_TEMP}/livecanary" ./cmd/livecanary

      - name: run live canary
        id: canary
        env:
          OUT_DIR: ${{ runner.temp }}/live-canary
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          set +e
          "${RUNNER_TEMP}/livecanary" run -out "${OUT_DIR}/manifest.json" 2>&1 | tee "${OUT_DIR}/run.log"
          status=("${PIPESTATUS[@]}")
          set -e
          test "${status[1]}" -eq 0
          case "${status[0]}" in
            0|1|2) echo "exit_code=${status[0]}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "::error::livecanary process failed with exit ${status[0]}"; exit 1 ;;
          esac

      - name: write artifact checksums
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/live-canary
        run: |
          set -euo pipefail
          cd "${OUT_DIR}"
          : > SHA256SUMS
          for file in manifest.json registry.json report.json run.log; do
            if [ -f "${file}" ]; then
              sha256sum "${file}" >> SHA256SUMS
            fi
          done

      - name: verify artifact coherence
        id: verify
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/live-canary
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/livecanary" verify -dir "${OUT_DIR}" | tee "${OUT_DIR}/verify.txt"
          cat "${OUT_DIR}/verify.txt" >> "${GITHUB_STEP_SUMMARY}"

      - name: record observation state
        id: observation
        if: always() && steps.verify.outcome == 'success'
        env:
          OUT_DIR: ${{ runner.temp }}/live-canary
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          state="$(jq -er '.state' "${OUT_DIR}/report.json")"
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Live canary observation: ${state}"
            if [ "${EVENT_NAME}" = schedule ] && [ "${state}" != passed ]; then
              echo "Temporary scheduled report-only policy: non-approval is expected; this is not an audit pass or release approval."
            fi
            jq -r '.state_reasons[] | "- \(.category): \(.detail)"' "${OUT_DIR}/report.json"
            echo '```'
            cat "${OUT_DIR}/SHA256SUMS"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: upload immutable observation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-canary
          if-no-files-found: error
          retention-days: 90

      - name: enforce observation result
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
          REF_TYPE: ${{ inputs.release_tag != '' && 'tag' || github.ref_type }}
          OBSERVED_STATE: ${{ steps.observation.outputs.state }}
          CANARY_EXIT_CODE: ${{ steps.canary.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "${OBSERVED_STATE}:${CANARY_EXIT_CODE}" in
            passed:0) exit 0 ;;
            failed:1|inconclusive:2)
              if [ "${EVENT_NAME}" = schedule ]; then
                echo "::notice::Scheduled non-approval recorded (${OBSERVED_STATE}); see Summary and artifact. No audit or release approval."
                exit 0
              fi
              if [ "${REF_TYPE}" = tag ] && [[ "${REF_NAME}" == *-* ]] && [ "${OBSERVED_STATE}" = inconclusive ]; then
                echo "::notice::Prerelease canary was inconclusive; artifact delivered without audit or release approval."
                exit 0
              fi
              ;;
            *) echo "::error::Canary exit code does not match a verified observation"; exit 1 ;;
          esac
          echo "::error::live canary did not pass; state and failure classification are in the uploaded artifact"
          exit 1
