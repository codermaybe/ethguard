# EthGuard CI
#
# Bench: full unit suite runs in ~16s locally, so every job runs the full
# test set rather than slicing by package. Concurrency is collapsed so a
# force-push to an open PR does not queue stale runs.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Weekly report-only passes (govulncheck, deadcode inventory) run off this
  # cron; pull_request and push runs skip the two jobs via their `if`.
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  release-config:
    name: release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          install-only: true
      - name: validate release configuration
        run: |
          goreleaser check
          for script in scripts/*.sh; do bash -n "$script"; done
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # Gate 1: fast hygiene. Fail here before paying for the test matrix.
  check:
    name: gofmt / tidy / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt-ed"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: generated wire freshness
        run: |
          generated="$(mktemp)"
          audit="$(mktemp)"
          trap 'rm -f "$generated" "$audit"' EXIT
          go run ./internal/wiregen -out "$generated" -audit-out "$audit"
          if ! cmp -s "$generated" ethapi/types.gen.go; then
            echo "::error::regenerate ethapi/types.gen.go with go generate ./ethapi"
            diff -u ethapi/types.gen.go "$generated"
            exit 1
          fi
          if ! cmp -s "$audit" ethapi/types.audit.json; then
            echo "::error::regenerate ethapi/types.audit.json with go generate ./ethapi"
            diff -u ethapi/types.audit.json "$audit"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: compile opt-in anvil tests without starting a chain
        run: go test -tags anvil -run '^$' ./...

  # Gate 2: unit + race (part of the full suite; kept as one job while the
  # suite stays this fast — split into shards only when it grows).
  # The full suite uses -race; compile-only and focused transport checks are
  # separate gates with their own scope.
  test:
    name: test (full suite)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race (package-local coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: go test -race (cross-package coverage)
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage-cross.out ./...
      - name: coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage-cross.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-cross.out
          retention-days: 7

  # The roadmap's closing checks declare a dedicated verification gate beyond
  # the unit suite: the ^TestVerification integration module under the race
  # detector, run twice with shuffled order, so ordering or repeat-dependent
  # failures surface. It is its own job so such a failure is distinguishable
  # from a unit-suite failure in the checks list.
  verification:
    name: verification gate (race ×2, shuffled)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: TestVerification race ×2 shuffled
        run: go test ./internal/verification/integration -run '^TestVerification' -race -count=2 -shuffle=on

  # Build once so compilation failures are distinguishable from test failures
  # in the required checks list.
  build:
    name: build (all packages)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...

  # Cross-platform baseline: the tree must build and vet on Windows too.
  # .gitattributes pins LF checkouts, so the working tree is byte-identical
  # to the Linux jobs. Tests stay Linux-only: the timing-sensitive wire and
  # scheduling tests are calibrated to the Linux runners, and the race run
  # doubles their cost.
  windows:
    name: build / vet (windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  # Link-time gate: production/native execution must not link ethclient.
  # The internal geth oracle is isolated to testkit and diagnostic tools.
  linktime:
    name: native architecture and oracle isolation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: native execution graph excludes ethclient
        run: |
          native_packages="$(go list -deps . ./internal/runtime ./pool ./rpc)"
          if grep -q 'go-ethereum/ethclient' <<< "$native_packages"; then
            echo "::error::the native execution graph links ethclient"
            grep 'go-ethereum/ethclient' <<< "$native_packages"
            exit 1
          fi
      - name: geth oracle stays in internal testkit
        run: |
          if ! go list -deps ./internal/testkit/gethoracle | grep -q 'go-ethereum/ethclient'; then
            echo "::error::the internal geth oracle does not expose its comparison client"
            exit 1
          fi
      - name: native transport and oracle tests
        run: go test ./internal/testkit/gethoracle ./internal/transport/http/... ./internal/transport/wss/...

  # Scheduled fuzzing exercises untrusted JSON and WebSocket frame parsers
  # outside the pull-request critical path. Any discovered input is emitted by
  # Go as a corpus file and must be committed as a deterministic regression.
  # Use the release contract's count budget to avoid Go duration-deadline races.
  fuzz:
    name: scheduled fuzz (count budget)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: JSON safety
        run: go test ./internal/jsonsafe -run=^$ -fuzz=FuzzValidateClassifies -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: JSON-RPC response decoder
        run: go test ./internal/rpcwire -run=^$ -fuzz=FuzzDecodeResponse -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: WebSocket frame stream
        run: go test ./internal/transport/wss -run=^$ -fuzz=FuzzFrameStream -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: WebSocket frame writer
        run: go test ./internal/transport/wss -run=^$ -fuzz=FuzzWriteFrameRoundTrip -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: access-list encoder
        run: go test ./internal/ethobject/accesslist -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: block encoder
        run: go test ./internal/ethobject/block -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: fee-history encoder
        run: go test ./internal/ethobject/feehistory -run=^$ -fuzz=FuzzEncodeIdempotentAndNormalizeAgrees -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: log encoder
        run: go test ./internal/ethobject/log -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: receipt encoder
        run: go test ./internal/ethobject/receipt -run=^$ -fuzz=FuzzEncodeKeyStableAndIdempotent -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: transaction encoder
        run: go test ./internal/ethobject/transaction -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: canonical wire normalizer
        run: go test ./internal/ethcodec -run=^$ -fuzz=FuzzNormalize -fuzztime=1000000x -parallel=2 -timeout=10m
      - name: archive discovered fuzz corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: |
            internal/jsonsafe/testdata/fuzz/
            internal/rpcwire/testdata/fuzz/
            internal/transport/wss/testdata/fuzz/
            internal/ethobject/accesslist/testdata/fuzz/
            internal/ethobject/block/testdata/fuzz/
            internal/ethobject/feehistory/testdata/fuzz/
            internal/ethobject/log/testdata/fuzz/
            internal/ethobject/receipt/testdata/fuzz/
            internal/ethobject/transaction/testdata/fuzz/
            internal/ethcodec/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  # Lint gate: .golangci.yml is tuned to zero baseline noise on the current
  # tree, so it blocks PRs. Policy rationale lives in .golangci.yml itself.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: pinned lint, default and anvil
        run: bash ./scripts/lint.sh

  # Reachable vulnerabilities are a release gate. The repository-owned script
  # pins the scanner version so @latest cannot silently raise the Go toolchain
  # requirement, and keeps local preflight and CI behavior identical.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan reachable vulnerabilities
        run: bash ./scripts/govulncheck.sh

  # Weekly report-only dead-code inventory. Library exports are normally
  # unreachable from tests because external consumers reach them, so running
  # this on every push would add noise without acting as a correctness gate.
  # The tool is pinned to keep the scheduled job compatible and reproducible.
  deadcode:
    name: deadcode inventory (report-only)
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.41.0
      - name: unreachable funcs
        run: ~/go/bin/deadcode -test ./...
