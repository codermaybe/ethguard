# EthGuard CI
#
# Bench: full unit suite runs in ~16s locally, so every job runs the full
# test set rather than slicing by package. Concurrency is collapsed so a
# force-push to an open PR does not queue stale runs.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Weekly report-only passes (govulncheck, deadcode inventory) run off this
  # cron; pull_request and push runs skip the two jobs via their `if`.
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  # Gate 1: fast hygiene. Fail here before paying for the test matrix.
  check:
    name: gofmt / tidy / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt-ed"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...

  # Gate 2: unit + race (part of the full suite; kept as one job while the
  # suite stays this fast — split into shards only when it grows).
  # Every `go test` invocation in this repository carries -race: the
  # concurrency-sensitive pool/aggregator paths only surface data races under
  # the detector, and the suite is fast enough that race coverage is free.
  test:
    name: test (full suite)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race (with coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Lint runs only on the weekly schedule until its config is tuned; it does
  # not gate PRs yet. Drop the `if` and commit a .golangci.yml once stable.

  # The roadmap's closing checks declare a dedicated verification gate beyond
  # the unit suite: the ^TestVerification integration module under the race
  # detector, run twice with shuffled order, so ordering or repeat-dependent
  # failures surface. It is its own job so such a failure is distinguishable
  # from a unit-suite failure in the checks list.
  verification:
    name: verification gate (race ×2, shuffled)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: TestVerification race ×2 shuffled
        run: go test ./internal/verification/integration -run '^TestVerification' -race -count=2 -shuffle=on

  # Build once so compilation failures are distinguishable from test failures
  # in the required checks list.
  build:
    name: build (all packages)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...

  # Cross-platform baseline: the tree must build and vet on Windows too.
  # .gitattributes pins LF checkouts, so the working tree is byte-identical
  # to the Linux jobs. Tests stay Linux-only: the timing-sensitive wire and
  # scheduling tests are calibrated to the Linux runners, and the race run
  # doubles their cost.
  windows:
    name: build / vet (windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  # Link-time gate: the default build must not link the go-ethereum client,
  # and the geth compatibility channel (gethcompat) must build and run its
  # own tests. Both channels share one interlock, so the tests run here too.
  linktime:
    name: link-time channels (native default + gethcompat)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: default build excludes ethclient
        run: |
          if go list -deps . | grep -q 'go-ethereum/ethclient'; then
            echo "::error::the default build links ethclient"
            go list -deps . | grep 'go-ethereum/ethclient'
            exit 1
          fi
      - name: gethcompat links the compatibility adapter
        run: |
          if ! go list -deps ./gethcompat | grep -q 'go-ethereum/ethclient'; then
            echo "::error::gethcompat does not link the adapter it exposes"
            exit 1
          fi
      - name: compatibility channel tests
        run: go test ./gethcompat/... ./internal/transport/geth/... ./internal/transport/http/...

  # Scheduled fuzzing exercises untrusted JSON and WebSocket frame parsers
  # outside the pull-request critical path. Any discovered input is emitted by
  # Go as a corpus file and must be committed as a deterministic regression.
  fuzz:
    name: scheduled fuzz (short budget)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: JSON safety
        run: go test ./internal/jsonsafe -run=^$ -fuzz=FuzzValidateClassifies -fuzztime=30s
      - name: JSON-RPC response decoder
        run: go test ./internal/rpcwire -run=^$ -fuzz=FuzzDecodeResponse -fuzztime=30s
      - name: WebSocket frame stream
        run: go test ./internal/transport/wss -run=^$ -fuzz=FuzzFrameStream -fuzztime=30s
      - name: WebSocket frame writer
        run: go test ./internal/transport/wss -run=^$ -fuzz=FuzzWriteFrameRoundTrip -fuzztime=30s
      - name: access-list encoder
        run: go test ./rpc/internal/objects/accesslist -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=30s
      - name: block encoder
        run: go test ./rpc/internal/objects/block -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=30s
      - name: fee-history encoder
        run: go test ./rpc/internal/objects/feehistory -run=^$ -fuzz=FuzzEncodeIdempotentAndNormalizeAgrees -fuzztime=30s
      - name: log encoder
        run: go test ./rpc/internal/objects/log -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=30s
      - name: receipt encoder
        run: go test ./rpc/internal/objects/receipt -run=^$ -fuzz=FuzzEncodeKeyStableAndIdempotent -fuzztime=30s
      - name: transaction encoder
        run: go test ./rpc/internal/objects/transaction -run=^$ -fuzz=FuzzEncodeIdempotent -fuzztime=30s
      - name: canonical wire normalizer
        run: go test ./rpc/internal/wire -run=^$ -fuzz=FuzzNormalize -fuzztime=30s
      - name: archive discovered fuzz corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: |
            internal/jsonsafe/testdata/fuzz/
            internal/rpcwire/testdata/fuzz/
            internal/transport/wss/testdata/fuzz/
            rpc/internal/objects/accesslist/testdata/fuzz/
            rpc/internal/objects/block/testdata/fuzz/
            rpc/internal/objects/feehistory/testdata/fuzz/
            rpc/internal/objects/log/testdata/fuzz/
            rpc/internal/objects/receipt/testdata/fuzz/
            rpc/internal/objects/transaction/testdata/fuzz/
            rpc/internal/wire/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  # Lint gate: .golangci.yml is tuned to zero baseline noise on the current
  # tree, so it blocks PRs. Policy rationale lives in .golangci.yml itself.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2

  # Reachable vulnerabilities are a release gate. The repository-owned script
  # pins the scanner version so @latest cannot silently raise the Go toolchain
  # requirement, and keeps local preflight and CI behavior identical.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan reachable vulnerabilities
        run: ./scripts/govulncheck.sh

  # Weekly report-only dead-code inventory. Library exports are normally
  # unreachable from tests because external consumers reach them, so running
  # this on every push would add noise without acting as a correctness gate.
  # The tool is pinned to keep the scheduled job compatible and reproducible.
  deadcode:
    name: deadcode inventory (report-only)
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.41.0
      - name: unreachable funcs
        run: ~/go/bin/deadcode -test ./...
