# Release a fixed, prevalidated commit; creating a public tag is the last gate.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New SemVer tag, for example v0.0.1-beta.4 (must not exist)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: validate and prepare exact commit
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          install-only: true
      - name: validate release candidate and approval protection
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo '::error::version must be a v-prefixed SemVer without build metadata'
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            IFS=. read -ra identifiers <<< "${VERSION#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0?* ]]; then
                echo '::error::numeric prerelease identifiers must not have leading zeros'
                exit 1
              fi
            done
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e dist
          test ! -e release-evidence
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          test "$remote_sha" = "$EXPECTED_SHA"
          set +e
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo '::error::tag already exists or remote tag lookup failed'
            exit 1
          fi
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/release")"
          jq -e '
            any(.protection_rules[]; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length) > 0)
            and .deployment_branch_policy.custom_branch_policies == true
          ' <<< "$environment"
          branches="$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" --jq .branch_policies)"
          jq -e 'length == 1 and .[0].name == "master" and .[0].type == "branch"' <<< "$branches"
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp)"
          jq -e --arg version "$VERSION" 'all(.[][]; .tag_name != $version)' <<< "$releases"
          previous="$(jq -r '[.[][] | select(.draft == false)][0].tag_name // empty' <<< "$releases")"
          mkdir release-evidence
          printf '%s\n' "$EXPECTED_SHA" > release-evidence/commit.txt
          printf 'sha=%s\nversion=%s\nprevious=%s\n' "$EXPECTED_SHA" "$VERSION" "$previous" >> "$GITHUB_OUTPUT"
          printf '### Candidate %s\n\nCommit: `%s`\nPrevious published release: `%s`\n' "$VERSION" "$EXPECTED_SHA" "$previous" >> "$GITHUB_STEP_SUMMARY"
      - name: full quality gate
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          export ETHGUARD_ACCEPT_EXTERNAL_SIMULATE_GAP=0
          if [[ "$VERSION" == *-* ]]; then
            export ETHGUARD_ACCEPT_EXTERNAL_SIMULATE_GAP=1
          fi
          bash ./scripts/release_check.sh 2>&1 | tee release-evidence/preflight.log
      - name: public API report
        env:
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS" ]; then
            bash ./scripts/release_api_diff.sh "$PREVIOUS"
          else
            echo 'First published release: no previous public API baseline.' > release-evidence/api-diff.txt
          fi
          cat release-evidence/api-diff.txt >> "$GITHUB_STEP_SUMMARY"
      - name: fuzz sprint (jsonsafe)
        run: |
          set -euo pipefail
          # Go 1.26 duration deadlines can fail spuriously: golang/go#75804.
          go test -race -fuzz=FuzzValidate -fuzztime=1000000x -parallel=2 -timeout=10m ./internal/jsonsafe/ 2>&1 | tee release-evidence/fuzz-jsonsafe.log
      - name: fuzz sprint (wire)
        run: |
          set -euo pipefail
          go test -race -fuzz=FuzzNormalize -fuzztime=1000000x -parallel=2 -timeout=10m ./rpc/internal/wire/ 2>&1 | tee release-evidence/fuzz-wire.log
      - name: build and verify release payload
        run: |
          set -euo pipefail
          bash ./scripts/release_build.sh --keep-artifacts 2>&1 | tee release-evidence/build.log
          files=(checksums.sha256)
          while read -r _digest filename; do
            files+=("${filename#\*}")
          done < dist/checksums.sha256
          tar -cf release-evidence/payload.tar -C dist "${files[@]}"
      - name: freeze manifest and release notes
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          SHA: ${{ steps.candidate.outputs.sha }}
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
        run: |
          set -euo pipefail
          printf '# %s\n\nCommit: `%s`\n\n## Changes\n\n' "$VERSION" "$SHA" > release-evidence/notes.md
          range="$SHA"
          if [ -n "$PREVIOUS" ]; then range="$PREVIOUS..$SHA"; fi
          git log --format='- %s (%h)' "$range" >> release-evidence/notes.md
          if [[ "$VERSION" == *-* ]]; then
            printf '\n## Compatibility boundary\n\nExperimental prerelease; not an EthClient: complete release. Requires Go 1.26.10.\nDefault EthClient SimulateV1 is unavailable. SyncProgress omits seven upstream fields; Done() may report completion while indexing remains.\nSee the API difference report in the approved workflow artifact before upgrading.\n' >> release-evidence/notes.md
          fi
          payload_sha="$(sha256sum release-evidence/payload.tar)"
          payload_sha="${payload_sha%% *}"
          jq -n --arg version "$VERSION" --arg sha "$SHA" --arg previous "$PREVIOUS" --arg payload "$payload_sha" --arg run "$GITHUB_RUN_ID" \
            '{schema:1,version:$version,commit:$sha,previous:$previous,payload_sha256:$payload,run_id:$run,goreleaser:"2.20.0"}' > release-evidence/manifest.json
          (
            cd release-evidence
            sha256sum manifest.json payload.tar api-diff.txt notes.md > evidence.sha256
          )
          cat release-evidence/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: archive candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: archive failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
      - name: clean successful preparation
        if: success()
        run: rm -rf -- dist release-evidence

  publish:
    name: approve and publish verified payload
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/release-evidence
      - name: verify approved evidence
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          cd candidate/release-evidence
          sha256sum -c evidence.sha256
          jq -e --arg version "$VERSION" --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            '.schema == 1 and .version == $version and .commit == $sha and .run_id == $run' manifest.json
          printf '%s  payload.tar\n' "$(jq -r .payload_sha256 manifest.json)" | sha256sum -c -
          cd ../..
          test ! -e dist
          mkdir dist
          tar -xf candidate/release-evidence/payload.tar -C dist
          bash ./scripts/release_build.sh --verify-artifacts
      - name: create immutable tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" --method POST -f "tag=$VERSION" -f "object=$SHA" -f type=commit \
            -f "message=Release $VERSION; verified commit $SHA; workflow $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$VERSION" -f "sha=$tag_sha"
          args=(--verify-tag --draft --title "$VERSION" --notes-file candidate/release-evidence/notes.md)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"
          gh release upload "$VERSION" dist/*
      - name: verify uploaded payload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(gh release view "$VERSION" --json assets --jq '.assets | length')" -eq 16
          mkdir candidate/download
          gh release download "$VERSION" --dir candidate/download
          cmp dist/checksums.sha256 candidate/download/checksums.sha256
          (
            cd candidate/download
            sha256sum -c checksums.sha256
          )
          latest=true
          if [[ "$VERSION" == *-* ]]; then latest=false; fi
          gh release edit "$VERSION" --draft=false --latest="$latest"
          gh release view "$VERSION" --json tagName,isDraft,isPrerelease,url > candidate/published.json
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          jq -e --arg version "$VERSION" --argjson prerelease "$prerelease" \
            '.tagName == $version and .isDraft == false and .isPrerelease == $prerelease' candidate/published.json
          cat candidate/published.json >> "$GITHUB_STEP_SUMMARY"
      - name: preserve publish diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-publish-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          retention-days: 14
      - name: clean successful publication
        if: success()
        run: rm -rf -- dist candidate

  canary:
    name: independent live observation
    needs: [prepare, publish]
    uses: ./.github/workflows/live-canary.yml
    with:
      commit_sha: ${{ needs.prepare.outputs.sha }}
      release_tag: ${{ needs.prepare.outputs.version }}
