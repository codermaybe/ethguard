# EthGuard release
#
# Tag-driven. Cross-compiles the cmd/ tools (soak, rpcsample, shapeprobe,
# specbundle, specdiff) for Linux amd64/arm64 and macOS arm64, produces
# SHA-256 checksums, and attaches everything to a GitHub Release on the tag.
#
# The Go module itself is consumed via `go get`, which needs no release step;
# binaries are shipped only so the cmd/ utilities can run without a toolchain.
#
# Publishing expectations (no action required, just awareness): pushing an
# unmodified tag 且 without a GitHub Release makes the module visible to the
# proxy with `unpublished` warning state; this workflow creates the Release
# immediately, so the window is seconds. First tag on the repo is similarly
# fine — the proxy treats it as a brand-new module path under /v0.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # apidiff needs the previous tagged module version to compare
          # against; fetch history so the runner has it.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Re-run the same offline gate maintainers execute before tagging. A tag
      # therefore cannot bypass formatting, module, static-analysis, build,
      # race-test, or reachable-vulnerability checks.
      - name: release preflight
        # The current prerelease line explicitly accepts the documented
        # external SimulateV1 gap. Stable tags remain strict and must expose
        # the complete locked business method set before release.
        env:
          ETHGUARD_ACCEPT_EXTERNAL_SIMULATE_GAP: ${{ contains(github.ref_name, '-') && '1' || '0' }}
        run: ./scripts/release_check.sh

      # Public-surface guard, informed by the previous tag. The first tag has
      # no comparison basis and therefore skips before installing the tool.
      # Pin apidiff for reproducibility. Keep toolchain selection explicit for
      # this isolated tool install even though the module now requires Go
      # 1.26.10.
      - name: apidiff vs previous tag
        env:
          APIDIFF_VERSION: v0.0.0-20261014143641-f0251eb4aa3e
          GOTOOLCHAIN: auto
          MODULE_PATH: github.com/codermaybe/ethguard
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "${prev_tag}" ]; then
            echo "no previous tag; first release, skipping apidiff"
            exit 0
          fi

          tool_dir="${RUNNER_TEMP}/tools"
          old_tree="${RUNNER_TEMP}/ethguard-${prev_tag}"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install "golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION}"
          git worktree add --detach "${old_tree}" "refs/tags/${prev_tag}"
          trap 'git worktree remove --force "${old_tree}"' EXIT

          for pkg in . ethadapter; do
            package_path="${MODULE_PATH}"
            package_dir="."
            artifact_name="root"
            if [ "${pkg}" != "." ]; then
              package_path="${MODULE_PATH}/${pkg}"
              package_dir="${pkg}"
              artifact_name="${pkg}"
            fi

            (
              cd "${old_tree}/${package_dir}"
              "${tool_dir}/apidiff" -w "${RUNNER_TEMP}/${artifact_name}-old.api" "${package_path}"
            )
            (
              cd "${GITHUB_WORKSPACE}/${package_dir}"
              "${tool_dir}/apidiff" -w "${RUNNER_TEMP}/${artifact_name}-new.api" "${package_path}"
            )
            "${tool_dir}/apidiff" -incompatible \
              "${RUNNER_TEMP}/${artifact_name}-old.api" \
              "${RUNNER_TEMP}/${artifact_name}-new.api"
          done

      - name: cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          for cmd in soak rpcsample shapeprobe specbundle specdiff; do
            for platform in linux-amd64 linux-arm64 darwin-arm64; do
              goos="${platform%%-*}"
              goarch="${platform#*-}"
              output="dist/${cmd}_${goos}_${goarch}"
              if [ "${goos}" = "windows" ]; then
                output="${output}.exe"
              fi
              GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w" \
                -o "${output}" "./cmd/${cmd}"
            done
          done
          cd dist
          sha256sum ./* > checksums.sha256

      # Fuzz sprint (P4): every tag burns ~5 min on the two untrusted-input
      # packages (jsonsafe, wire). Deliberately NOT on push/PR — fuzzer cost
      # is only justified at the release boundary.
      - name: fuzz sprint (jsonsafe)
        run: go test -race -fuzz=FuzzValidate -fuzztime=120s ./internal/jsonsafe/
      - name: fuzz sprint (wire)
        run: go test -race -fuzz=FuzzNormalize -fuzztime=120s ./rpc/internal/wire/

      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
